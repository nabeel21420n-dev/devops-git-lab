name: First CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show runner information
        run: |
          echo "CI runner successfully start ho gaya"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Branch/ref: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"
          uname -a
          git --version

      - name: Validate tracked Bash scripts
        shell: bash
        run: |
          set -euo pipefail

          scripts="$(git ls-files '*.sh')"

          if [ -z "${scripts}" ]; then
            echo "Koi tracked Bash script nahi mili — check skip."
          else
            while IFS= read -r script; do
              echo "Checking: ${script}"
              bash -n "${script}"
            done <<< "${scripts}"
          fi

          echo "Bash syntax checks successful"

      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          echo "README.md repository mein mojood hai"

      - name: Generate CI report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-output

          {
            echo "===== CI VALIDATION REPORT ====="
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Git ref: ${GITHUB_REF}"
            echo "Commit SHA: ${GITHUB_SHA}"
            echo "Result: validation successful"
          } | tee ci-output/ci-report.txt

      - name: Upload CI report
        uses: actions/upload-artifact@v7
        with:
          name: ci-report-${{ github.run_number }}
          path: ci-output/ci-report.txt
          if-no-files-found: error
          retention-days: 7

  node-test:
    name: Test Node application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test
