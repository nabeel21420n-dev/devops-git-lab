name: First CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail

          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Branch/ref: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"
          uname -a
          git --version

      - name: Validate tracked Bash scripts
        shell: bash
        run: |
          set -euo pipefail

          scripts="$(git ls-files '*.sh')"

          if [ -z "${scripts}" ]; then
            echo "Koi tracked Bash script nahi mili — check skip."
          else
            while IFS= read -r script; do
              echo "Checking: ${script}"
              bash -n "${script}"
            done <<< "${scripts}"
          fi

          echo "Bash syntax checks successful"

      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          echo "README.md repository mein mojood hai"

      - name: Generate CI report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-output

          {
            echo "===== CI VALIDATION REPORT ====="
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Git ref: ${GITHUB_REF}"
            echo "Commit SHA: ${GITHUB_SHA}"
            echo "Result: validation successful"
          } | tee ci-output/ci-report.txt

      - name: Upload CI report
        uses: actions/upload-artifact@v7
        with:
          name: ci-report-${{ github.run_number }}
          path: ci-output/ci-report.txt
          if-no-files-found: error
          retention-days: 7

  node-test:
    name: Test Node application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  docker-build:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest

    needs:
      - validate
      - node-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          tags: ci-node-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start test container
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name ci-node-app \
            -p 3000:3000 \
            ci-node-app:${GITHUB_SHA}

      - name: Smoke-test health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            echo "Health-check attempt: ${attempt}"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3000/health; then
                echo
                echo "Container health test successful"
                exit 0
            fi

            sleep 2
          done

          echo "Application healthy nahi hui"
          exit 1

      - name: Inspect container
        run: |
          docker ps
          docker inspect \
            --format='Status={{.State.Status}} Image={{.Config.Image}}' \
            ci-node-app

      - name: Show container logs
        if: always()
        run: docker logs ci-node-app || true


      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ci-node-app:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.run_number }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Show vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci-node-app:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Enforce vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci-node-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'


      - name: Remove test container
        if: always()
        run: docker rm -f ci-node-app || true

  publish-image:
    name: Publish Docker image to GHCR

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - docker-build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
